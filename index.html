<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wildbound</title>
  <meta name="description" content="Move together. Awaken your clan. A Seattle clan-based movement game where elemental spirits grow as you walk, lift, run and swim." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛰️</text></svg>" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">⛰️</span> Wildbound</div>
    <div id="player-chip" class="player-chip"></div>
  </header>

  <nav id="tabs" class="tabs" aria-label="Main">
    <button data-tab="home"><span>🏕️</span>Camp</button>
    <button data-tab="log"><span>➕</span>Log</button>
    <button data-tab="clan"><span>🔥</span>Clan</button>
    <button data-tab="chat"><span>💬</span>Chat</button>
    <button data-tab="journey"><span>🧭</span>Journey</button>
    <button data-tab="ranks"><span>🏆</span>Ranks</button>
  </nav>

  <main id="view" class="view"></main>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="vendor/three.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
