<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Wildbound</title>
  <meta name="description" content="Move together. Hold the city. A Seattle clan movement game: awaken your spirit, raise vigils on real landmarks." />
  <meta name="theme-color" content="#0f1612" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="apple-mobile-web-app-title" content="Wildbound" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">⛰️</span> Wildbound</div>
    <div id="player-chip" class="player-chip"></div>
  </header>

  <nav id="tabs" class="tabs" aria-label="Main">
    <button data-tab="map"><span>🗺️</span>Map</button>
    <button data-tab="log"><span>➕</span>Log</button>
    <button data-tab="clan"><span>🔥</span>Clan</button>
    <button data-tab="chat"><span>💬</span>Chat</button>
    <button data-tab="ranks"><span>🏆</span>Ranks</button>
  </nav>

  <main id="view" class="view"></main>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="vendor/three.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
